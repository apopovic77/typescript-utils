name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production=false

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Check types
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Notify on success
        if: success()
        run: echo "✅ CI checks passed"

      - name: Notify on failure
        if: failure()
        run: echo "❌ CI checks failed"

